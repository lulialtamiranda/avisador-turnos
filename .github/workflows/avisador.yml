name: avisador-turnos

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar requests
        run: pip install requests

      - name: Revisar turnos
        env:
          UNA_VEZ: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FECHA_LIMITE: "2026-10-15"
        run: python avisador_turnos.py

      - name: Guardar turnos ya avisados
        run: |
          git config user.name "avisador-bot"
          git config user.email "avisador-bot@users.noreply.github.com"
          git add vistos.json || true
          git diff --cached --quiet || (git commit -m "actualizar vistos" && git push)
